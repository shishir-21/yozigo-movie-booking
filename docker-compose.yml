services:
  db:
    image: postgres:16-alpine
    container_name: yozigo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yozigo
      POSTGRES_PASSWORD: yozigo_dev_password
      POSTGRES_DB: yozigo
    ports:
      - "5432:5432"
    volumes:
      - yozigo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yozigo -d yozigo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  yozigo_pgdata:
